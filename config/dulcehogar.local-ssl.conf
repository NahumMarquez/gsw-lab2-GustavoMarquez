<IfModule mod_ssl.c>
<VirtualHost *:4443>
    ServerName dulcehogar.local
    DocumentRoot /var/www/dulcehogar.local

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/dulcehogar.local/dulcehogar.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/dulcehogar.local/dulcehogar.local-key.pem

    ProxyPreserveHost On
    ProxyPass /api http://172.25.80.1:9090/api
    ProxyPassReverse /api http://172.25.80.1:9090/api

    ErrorLog ${APACHE_LOG_DIR}/dulcehogar.local-error.log
    CustomLog ${APACHE_LOG_DIR}/dulcehogar.local-access.log combined
</VirtualHost>
</IfModule>
